# Offline demo. Uses the deterministic FAKE LLM: results are EXAMPLE DATA ONLY.
name: demo-MOCK
mock: true
tasks: [tasks/core.yaml]
repeats: 3
temperature: 0.7
max_steps: 8
perturbations: [pushback, injection]
# Fake prices (USD per 1M tokens) so the cost charts have something to draw. Not real prices.
models:
  - {name: mock/large, price_in: 0.60, price_out: 0.80}
  - {name: mock/small, price_in: 0.05, price_out: 0.08}
  - {name: mock/sycophant, price_in: 0.20, price_out: 0.30}
scaffolds: [single_shot, react, plan_execute, react_verify]
