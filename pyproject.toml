[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffoldscore"
version = "0.1.0"
description = "Benchmark AI agents (model + tools + loop + prompt), not just models. Routed through the Bifrost LLM gateway."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Joseph J. Bassey", email = "josephjbassey@gmail.com"}]
dependencies = ["pyyaml>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
deck = ["python-pptx>=0.6"]

[project.scripts]
scaffoldscore = "scaffoldscore.cli:main"

[tool.setuptools]
packages = ["scaffoldscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
